name: Deploy De Drakengardt Wiki

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published campaign
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated DnDWiki site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Observe configured custom domain
        shell: bash
        run: |
          set -u

          host="$(jq -r '.deployment.customDomain // empty' dndwiki.campaign.json)"
          expected_cname="${{ github.repository_owner }}.github.io"

          if [[ -z "${host}" ]]; then
            echo "No deployment.customDomain is configured; skipping custom-domain observation."
            exit 0
          fi

          echo "=== Custom domain observation ==="
          echo "host=${host}"
          echo "expected_cname=${expected_cname}"

          cname=""
          if command -v dig >/dev/null 2>&1; then
            cname="$(dig +short CNAME "${host}" | sed 's/\.$//' | head -n 1)"
            echo "observed_cname=${cname:-<none>}"
            dig +noall +answer CNAME "${host}" || true
          else
            echo "dig is unavailable on this runner; exact CNAME observation skipped."
          fi

          echo
          echo "=== HTTP ==="
          set +e
          http_headers="$(curl -sS -I --max-time 20 "http://${host}/" 2>&1)"
          http_exit=$?
          set -e
          printf '%s\n' "${http_headers}"
          echo "http_curl_exit=${http_exit}"

          echo
          echo "=== HTTPS ==="
          set +e
          https_headers="$(curl -sS -I --max-time 20 "https://${host}/" 2>&1)"
          https_exit=$?
          set -e
          printf '%s\n' "${https_headers}"
          echo "https_curl_exit=${https_exit}"

          echo
          echo "=== TLS certificate ==="
          cert_summary=""
          if command -v openssl >/dev/null 2>&1; then
            set +e
            timeout 20 openssl s_client -connect "${host}:443" -servername "${host}" </dev/null 2>/tmp/tls.err | awk '/BEGIN CERTIFICATE/{flag=1} flag{print} /END CERTIFICATE/{exit}' > /tmp/leaf.pem
            tls_exit=$?
            set -e
            cat /tmp/tls.err || true
            if [[ -s /tmp/leaf.pem ]]; then
              cert_summary="$(openssl x509 -in /tmp/leaf.pem -noout -subject -issuer -dates -ext subjectAltName 2>&1 || true)"
              printf '%s\n' "${cert_summary}"
            else
              echo "No leaf certificate was captured."
            fi
            echo "tls_probe_exit=${tls_exit}"
          fi

          if [[ -n "${cname}" && "${cname}" != "${expected_cname}" ]]; then
            state="DNS_MISMATCH"
          elif [[ "${https_exit}" -eq 0 ]]; then
            state="HTTPS_READY"
          elif [[ -n "${cname}" ]]; then
            state="DNS_READY_HTTPS_PENDING"
          else
            state="OBSERVATION_INCOMPLETE"
          fi

          {
            echo "## Custom domain observation"
            echo
            echo "- Host: \`${host}\`"
            echo "- Expected CNAME: \`${expected_cname}\`"
            echo "- Observed CNAME: \`${cname:-unknown}\`"
            echo "- HTTP curl exit: \`${http_exit}\`"
            echo "- HTTPS curl exit: \`${https_exit}\`"
            echo "- State: **${state}**"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "RESULT=${state}"
