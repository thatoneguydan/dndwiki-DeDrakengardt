name: Deploy De Drakengardt Wiki

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'reader-ui/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published campaign
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preserve reader interface for the legacy publisher
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git hash-object site/runtime/reader-chrome-refresh.css)" == c192d15a1ad0134e66b786e92d60141cc6e2c239 ]] &&
             [[ "$(git hash-object site/runtime/reader-chrome-refresh.mjs)" == 2c3542182a384c45023290dd62e0655eeb0899f0 ]] &&
             [[ "$(git hash-object site/runtime/tag-taxonomy-chrome.mjs)" == 115eade7d32345732d10a11fdb62b66bedde645d ]]; then
            for file in reader-chrome-refresh.css reader-chrome-refresh.mjs tag-taxonomy-chrome.mjs; do
              cp -- "reader-ui/$file" "site/runtime/$file"
            done
            # Keep the source registry's exact display-name casing and nested
            # previews only when all three installed modules are the known
            # legacy versions. Never overwrite partially upgraded publishers.
            if [[ "$(git hash-object site/runtime/player-identity.mjs)" == 9d3adec4b8c5e47b376d8ab7394a2d6d04adecf0 ]] &&
               [[ "$(git hash-object site/runtime/wiki-shell.mjs)" == bc650304d72804fe5fd6eb1319df8dc09ea62729 ]] &&
               [[ "$(git hash-object site/runtime/note-link-previews.mjs)" == 0f9f03143aace944b62a0b7147ea3a7417b77330 ]]; then
              for file in player-identity.mjs wiki-shell.mjs note-link-previews.mjs; do
                cp -- "reader-ui/$file" "site/runtime/$file"
              done
              echo "Applied the compatible identity, shell and nested-preview modules."
            else
              echo "Publisher identity/preview modules differ from legacy; keeping publisher versions."
            fi
            echo "Applied the accepted reader interface to the legacy publisher bundle."
          else
            echo "Publisher interface differs from the legacy bundle; keeping its files."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated dndwiki site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  observe-domain:
    name: Observe custom domain
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/observe-domain.yml

