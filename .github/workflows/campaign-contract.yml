name: DnDWiki Campaign Contract

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate public campaign boundary
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath './dndwiki.campaign.json' -Raw | ConvertFrom-Json
          if ($config.schemaVersion -ne 1) { throw 'schemaVersion must be 1.' }
          if ($config.campaignId -ne 'de-drakengardt') { throw 'Unexpected campaignId.' }
          if ($config.engineRepository -ne 'thatoneguydan/dndwiki') { throw 'Unexpected engineRepository.' }
          if ($config.publicationRoot -ne 'site') { throw 'publicationRoot must be site.' }
          if ($config.source.authority -ne 'private-obsidian-vault') { throw 'Source authority must remain the private Obsidian vault.' }
          if ($config.source.repositoryMirror -ne $false) { throw 'Public campaign repository must not be a vault mirror.' }
