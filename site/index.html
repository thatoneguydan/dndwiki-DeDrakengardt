<!doctype html>
<html lang="en" style="color-scheme: light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="dndwiki campaign wiki">
  <title>dndwiki</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./runtime/reader-chrome-refresh.css">
  <style id="dndwiki-reader-v41-fidelity">
    /* v4.1+ fidelity/layout corrections. Authored note semantics remain in the renderer. */
    :root {
      --dndwiki-persistent-rail-width: clamp(11rem, calc((100vw - 57.5rem) / 2), 19rem);
      --dndwiki-persistent-browse-width: var(--dndwiki-persistent-rail-width);
      /* Screenshot-calibrated to Dan's live Obsidian reading pane. The 18px/45rem
         pair scales the article by the same 1.125 factor, preserving its wrap
         measure while leaving the surrounding wiki chrome at the 16px baseline. */
      --dndwiki-reader-font-size: 18px;
      --line-width: 45rem;
    }

    .dndwiki-shell .dndwiki-search-shortcut {
      display: none !important;
    }

    /*
      Keep the search row, generated page header, article body, empty states, and
      result surface on one canonical reading axis. Percentage-based Minimal
      reading width is allowed only where the containing width matches the page
      layout, so it cannot shrink against an unrelated masthead grid track.
    */
    .dndwiki-shell .dndwiki-search,
    .dndwiki-shell .dndwiki-main > .dndwiki-page-header,
    .dndwiki-shell .dndwiki-page,
    .dndwiki-shell .dndwiki-empty,
    .dndwiki-shell .dndwiki-missing,
    .dndwiki-shell .dndwiki-gated {
      width: var(--dndwiki-reading-max) !important;
      max-width: 100% !important;
      margin-inline: auto;
    }

    .dndwiki-shell .dndwiki-search {
      justify-self: center !important;
    }

    .dndwiki-shell .dndwiki-topbar .dndwiki-search input {
      padding-right: 2.25rem !important;
    }

    /* Search results inherit the exact search-row edges instead of opening as
       a separately centered floating width. */
    .dndwiki-shell .dndwiki-search [data-dndwiki-search-results] > .dndwiki-search-results {
      position: static !important;
      inset: auto !important;
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      transform: none !important;
    }

    @media (min-width: 981px) {
      .dndwiki-shell .dndwiki-topbar {
        grid-template-columns: minmax(0, 1fr) minmax(19rem, var(--line-width)) minmax(0, 1fr) !important;
      }

      .dndwiki-shell .dndwiki-search {
        width: 100% !important;
      }
    }

    @media (max-width: 980px) {
      .dndwiki-shell .dndwiki-topbar {
        padding-inline: clamp(1rem, 3vw, 2.75rem) !important;
      }

      .dndwiki-shell .dndwiki-search {
        width: var(--dndwiki-reading-max) !important;
        max-width: 100% !important;
      }
    }

    @media (max-width: 860px) {
      .dndwiki-shell .dndwiki-topbar {
        padding-inline: clamp(.85rem, 3.5vw, 1.4rem) !important;
      }
    }

    .dndwiki-shell .dndwiki-main,
    .dndwiki-shell .dndwiki-main > .dndwiki-page-header,
    .dndwiki-shell .dndwiki-page {
      min-width: 0;
      max-width: 100%;
    }

    /* Scale only authored article content. Chrome remains on the 16px root
       scale, while 45rem / 18px keeps the same 40em wrap measure as 40rem / 16px. */
    .dndwiki-shell .dndwiki-page {
      font-size: var(--dndwiki-reader-font-size) !important;
    }

    .dndwiki-shell .dndwiki-page-header h1 {
      width: 100%;
      max-width: 100% !important;
      font-size: clamp(1.55rem, 2.3vw, 2.15rem) !important;
      line-height: 1.12 !important;
      letter-spacing: -.025em !important;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    /* The reader intentionally uses justified prose. Keep the final line left
       aligned while preserving the corrected Obsidian width/type metrics. */
    .dndwiki-shell .dndwiki-page p,
    .dndwiki-shell .dndwiki-page li {
      text-align: justify;
      text-align-last: left;
    }

    .dndwiki-shell .dndwiki-page ul,
    .dndwiki-shell .dndwiki-page ol {
      padding-inline-start: 1.8em;
    }

    .dndwiki-shell .dndwiki-page li {
      margin-block: .075em;
    }

    .dndwiki-shell .dndwiki-page li::marker {
      color: var(--text-faint);
      font-size: .88em;
    }

    .dndwiki-shell .dndwiki-page li > ul,
    .dndwiki-shell .dndwiki-page li > ol {
      position: relative;
      margin-block: .18em .28em !important;
      padding-inline-start: 1.9em !important;
    }

    .dndwiki-shell .dndwiki-page li > ul::before,
    .dndwiki-shell .dndwiki-page li > ol::before {
      content: '';
      position: absolute;
      top: .12em;
      bottom: .12em;
      left: -1em;
      width: 1px;
      background: var(--background-modifier-border);
      pointer-events: none;
    }

    /* v4.5: desktop browse becomes a real persistent workspace column. Padding
       the shell reduces its content box, so the masthead and article remain
       centered in the space that is actually available after the nav column. */
    @media (min-width: 1100px) {
      .dndwiki-shell[data-dndwiki-browse-persistent][data-dndwiki-browse-open] {
        box-sizing: border-box;
        padding-left: var(--dndwiki-persistent-browse-width);
      }

      .dndwiki-shell[data-dndwiki-browse-persistent] .dndwiki-primary-nav {
        width: var(--dndwiki-persistent-browse-width) !important;
        max-width: var(--dndwiki-persistent-browse-width) !important;
        box-shadow: none !important;
      }

      .dndwiki-shell[data-dndwiki-browse-persistent][data-dndwiki-browse-open] .dndwiki-browse-scrim {
        display: none !important;
      }

      body:has(.dndwiki-shell[data-dndwiki-browse-persistent][data-dndwiki-browse-open]) {
        overflow: auto !important;
      }
    }

    /* Continue Exploring belongs to the same reading column as the note. */
    .dndwiki-shell .dndwiki-main > .dndwiki-sidebar[data-dndwiki-context-footer] {
      width: var(--dndwiki-reading-max) !important;
      max-width: 100% !important;
      margin-inline: auto !important;
    }

    /* The desktop outline is a true mirror rail for Browse: same responsive
       width, full-height edge treatment, inner padding, and reclaimed content
       space when collapsed. Equal open rails keep the article centered in the
       viewport instead of merely placing an outline beside it. */
    .dndwiki-shell .dndwiki-outline-trigger {
      min-height: 36px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: .42rem;
      padding: .35rem .6rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: .79rem;
      font-weight: 620;
      line-height: 1.2;
    }

    .dndwiki-shell .dndwiki-outline-trigger::before {
      content: '☷';
      color: var(--text-faint);
      font-size: .92rem;
      line-height: 1;
    }

    .dndwiki-shell .dndwiki-outline-trigger:hover,
    .dndwiki-shell .dndwiki-outline-trigger[aria-expanded="true"] {
      background: var(--dndwiki-soft-hover);
      color: var(--text-normal);
    }

    @media (min-width: 1200px) {
      .dndwiki-shell[data-dndwiki-outline-persistent][data-dndwiki-outline-open] {
        box-sizing: border-box;
        padding-right: var(--dndwiki-persistent-rail-width);
      }

      #dndwiki-app .dndwiki-shell .dndwiki-layout.dndwiki-modern-layout:has(> .dndwiki-outline-rail) {
        display: block !important;
      }

      .dndwiki-shell .dndwiki-layout:has(> .dndwiki-outline-rail) > .dndwiki-main {
        min-width: 0;
      }

      .dndwiki-shell .dndwiki-outline-rail {
        position: fixed;
        z-index: 130;
        inset: 0 0 0 auto;
        width: var(--dndwiki-persistent-rail-width) !important;
        max-width: var(--dndwiki-persistent-rail-width) !important;
        max-height: none;
        box-sizing: border-box;
        margin: 0;
        padding: 0 .78rem 1.5rem;
        overflow: auto;
        overscroll-behavior: contain;
        border: 0;
        border-left: 1px solid var(--dndwiki-soft-line-strong);
        background: var(--background-primary);
        box-shadow: none;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        transform: translateX(calc(100% + 1.5rem));
        visibility: hidden;
        transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility .22s linear;
      }

      .dndwiki-shell[data-dndwiki-outline-open] .dndwiki-outline-rail {
        transform: translateX(0);
        visibility: visible;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-page-outline {
        min-height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-page-outline > summary {
        position: sticky;
        top: 0;
        z-index: 3;
        min-height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .75rem;
        box-sizing: border-box;
        margin-inline: -.78rem;
        padding: .9rem 1rem .78rem;
        border-bottom: 1px solid var(--dndwiki-soft-line);
        background: color-mix(in srgb, var(--background-primary) 95%, transparent);
        color: var(--text-normal);
        backdrop-filter: blur(14px);
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-page-outline > summary > span:first-child {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 1.05rem;
        font-weight: 720;
        letter-spacing: -.015em;
        line-height: 1.25;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-page-outline-count {
        color: var(--text-faint);
        font-size: .64rem;
        font-weight: 700;
        letter-spacing: .06em;
        white-space: nowrap;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-page-outline > summary::after {
        margin-left: .15rem;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-toc-list {
        display: block !important;
        margin: 0;
        padding: .75rem 0 .9rem;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-toc-link {
        min-height: 38px;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: .42rem .55rem;
        border-radius: 9px;
        font-size: .79rem;
        line-height: 1.28;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-toc-link[data-level="3"],
      .dndwiki-shell .dndwiki-outline-rail .dndwiki-toc-link[data-level="4"] {
        padding-left: 1.05rem;
      }

      .dndwiki-shell .dndwiki-outline-rail .dndwiki-toc-list li + li {
        margin-top: .08rem;
      }
    }

    @media (max-width: 1199px) {
      .dndwiki-shell .dndwiki-outline-trigger {
        display: none !important;
      }
    }

    .dndwiki-shell .dndwiki-toc-link[aria-current="location"] {
      background: var(--dndwiki-soft-accent);
      color: var(--text-normal);
      box-shadow: inset 2px 0 0 color-mix(in srgb, var(--interactive-accent) 72%, var(--text-normal));
      font-weight: 650;
    }

    @media (max-width: 620px) {
      .dndwiki-shell .dndwiki-page-header h1 {
        font-size: clamp(1.45rem, 6.5vw, 1.95rem) !important;
      }
    }
  </style>
</head>
<body>
  <div id="dndwiki-app" class="dndwiki-loading" aria-live="polite">Loading wiki…</div>
  <script type="module" src="./runtime/wiki-shell-entry.mjs"></script>
  <script type="module" src="./runtime/tag-taxonomy-chrome.mjs"></script>
  <script type="module" src="./runtime/reader-chrome-refresh.mjs"></script>
  <script type="module">
    /* The shell route uses a hash-within-a-hash, so native anchor scrolling is
       not available. Delegate outline clicks here and scroll only after the
       shell has rerendered and reader chrome has settled for two frames. This
       module also gives the desktop outline the same persistent/collapsible
       workspace semantics as the left Browse rail. */
    const root = document.getElementById('dndwiki-app');
    const OUTLINE_DESKTOP_MIN = 1200;
    let scrollRequest = 0;
    let outlineSyncQueued = false;

    function routeHeading(hash = window.location.hash) {
      const match = /^#\/page\/[a-z0-9][a-z0-9._-]{0,63}#(.*)$/.exec(String(hash ?? ''));
      if (match == null || match[1].length === 0) return null;
      try {
        return decodeURIComponent(match[1]).trim();
      } catch {
        return null;
      }
    }

    function scrollToRouteHeading(heading) {
      if (root == null || heading == null || heading.length === 0) return false;
      const normalized = heading.toLocaleLowerCase('en-US');
      const headings = root.querySelectorAll('[data-dndwiki-page] h1, [data-dndwiki-page] h2, [data-dndwiki-page] h3, [data-dndwiki-page] h4, [data-dndwiki-page] h5, [data-dndwiki-page] h6');
      const target = [...headings].find((element) => String(element.textContent ?? '').trim().toLocaleLowerCase('en-US') === normalized);
      if (target == null) return false;

      const topbarBottom = Number(root.querySelector('.dndwiki-topbar')?.getBoundingClientRect?.().bottom ?? 0);
      const targetTop = Number(target.getBoundingClientRect?.().top ?? 0) + Number(window.scrollY ?? window.pageYOffset ?? 0);
      window.scrollTo({ top: Math.max(0, targetTop - Math.max(0, topbarBottom) - 16), behavior: 'auto' });
      return true;
    }

    function scheduleRouteHeadingScroll() {
      const heading = routeHeading();
      const request = ++scrollRequest;
      if (heading == null) return;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (request === scrollRequest) scrollToRouteHeading(heading);
      }));
    }

    function outlinePreferenceKey(shell) {
      const campaignId = String(shell?.getAttribute('data-dndwiki-campaign-id') ?? '').trim();
      return campaignId.length > 0 ? `dndwiki:${campaignId}:outline-open` : 'dndwiki:reader:outline-open';
    }

    function storedOutlinePreference(shell) {
      try {
        const value = window.localStorage.getItem(outlinePreferenceKey(shell));
        if (value === 'open') return true;
        if (value === 'closed') return false;
      } catch {
        // Storage is optional; desktop still defaults open.
      }
      return null;
    }

    function persistOutlinePreference(shell, open) {
      try {
        window.localStorage.setItem(outlinePreferenceKey(shell), open ? 'open' : 'closed');
      } catch {
        // A blocked storage backend must not break outline navigation.
      }
    }

    function syncOutlinePanel() {
      outlineSyncQueued = false;
      const shell = root?.querySelector('.dndwiki-shell');
      const rail = root?.querySelector('[data-dndwiki-outline-rail]');
      const details = rail?.querySelector('[data-dndwiki-page-outline]');
      const persistent = Number(window.innerWidth ?? 0) >= OUTLINE_DESKTOP_MIN && shell != null && rail != null && details != null;

      if (!persistent) {
        shell?.removeAttribute('data-dndwiki-outline-persistent');
        shell?.removeAttribute('data-dndwiki-outline-open');
        shell?.querySelector('[data-dndwiki-outline-trigger]')?.remove();
        return;
      }

      shell.setAttribute('data-dndwiki-outline-persistent', '');
      rail.setAttribute('id', 'dndwiki-outline-panel');
      if (!details.hasAttribute('data-dndwiki-outline-state-ready')) {
        const preferred = storedOutlinePreference(shell);
        details.open = preferred ?? true;
        details.setAttribute('data-dndwiki-outline-state-ready', '');
      }

      const open = details.open === true;
      if (open) shell.setAttribute('data-dndwiki-outline-open', '');
      else shell.removeAttribute('data-dndwiki-outline-open');

      const access = shell.querySelector('.dndwiki-access');
      if (access != null && shell.querySelector('[data-dndwiki-outline-trigger]') == null) {
        access.insertAdjacentHTML('afterbegin', '<button class="dndwiki-outline-trigger" type="button" data-dndwiki-outline-trigger aria-controls="dndwiki-outline-panel" aria-expanded="true">On this page</button>');
      }
      shell.querySelector('[data-dndwiki-outline-trigger]')?.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function scheduleOutlineSync() {
      if (outlineSyncQueued) return;
      outlineSyncQueued = true;
      queueMicrotask(syncOutlinePanel);
    }

    function setOutlineOpen(open) {
      const shell = root?.querySelector('.dndwiki-shell');
      const details = root?.querySelector('[data-dndwiki-outline-rail] [data-dndwiki-page-outline]');
      if (shell == null || details == null) return false;
      details.open = open === true;
      persistOutlinePreference(shell, details.open);
      syncOutlinePanel();
      return true;
    }

    root?.addEventListener('click', (event) => {
      const outlineTrigger = event.target?.closest?.('[data-dndwiki-outline-trigger]');
      if (outlineTrigger != null) {
        event.preventDefault();
        const shell = root.querySelector('.dndwiki-shell');
        setOutlineOpen(shell?.hasAttribute('data-dndwiki-outline-open') !== true);
        return;
      }

      const outlineSummary = event.target?.closest?.('[data-dndwiki-outline-rail] [data-dndwiki-page-outline] > summary');
      if (outlineSummary != null) {
        setTimeout(() => {
          const shell = root.querySelector('.dndwiki-shell');
          const details = outlineSummary.closest('[data-dndwiki-page-outline]');
          if (shell != null && details != null) persistOutlinePreference(shell, details.open === true);
          syncOutlinePanel();
        }, 0);
      }

      const link = event.target?.closest?.('[data-dndwiki-toc-index]');
      if (link == null) return;
      const route = String(link.getAttribute('href') ?? '');
      if (!/^#\/page\/[a-z0-9][a-z0-9._-]{0,63}#/.test(route)) return;
      event.preventDefault();
      if (window.location.hash === route) scheduleRouteHeadingScroll();
      else window.location.hash = route;
    }, true);

    const outlineObserver = typeof MutationObserver === 'function' && root != null
      ? new MutationObserver(scheduleOutlineSync)
      : null;
    outlineObserver?.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['open'] });
    window.addEventListener('hashchange', () => {
      scheduleRouteHeadingScroll();
      scheduleOutlineSync();
    }, true);
    window.addEventListener('resize', scheduleOutlineSync, { passive: true });
    scheduleRouteHeadingScroll();
    scheduleOutlineSync();
  </script>
</body>
</html>
